name: Build
on:
  push:
  workflow_dispatch:
env:
  GOFLAGS: -mod=mod
permissions:
  contents: write
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: |
          sed -i '/^replace /d' go.mod && go mod download
          L='-s -w -checklinkname=0'
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="$L" -o out/freeproxy-android ./cmd/freeproxy
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="$L" -o out/freeproxy-linux-arm64 ./cmd/freeproxy
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$L" -o out/freeproxy-linux-amd64 ./cmd/freeproxy
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$L" -o out/freeproxy-windows.exe ./cmd/freeproxy
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: out/ }
  ios:
    needs: desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build Go core (gomobile)
        run: |
          sed -i '' '/^replace /d' go.mod
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          gomobile init
          gomobile bind -target ios -iosversion 15.0 -ldflags="-s -w -checklinkname=0" -o ios/Mobile.xcframework ./mobile
      - name: Build app
        run: |
          brew install xcodegen
          set -o pipefail
          cd ios && xcodegen generate
          xcodebuild -project FreeProxy.xcodeproj -scheme FreeProxy -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/FreeProxy.app Payload/
          zip -qry ../FreeProxy.ipa Payload
      - name: Source zip
        run: git archive --format=zip -o FreeProxy-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: "FreeProxy*" }
      - uses: actions/download-artifact@v4
        with: { name: desktop, path: out }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FreeProxy build ${{ github.run_number }}
          files: |
            FreeProxy.ipa
            FreeProxy-source.zip
            out/*
